<div class="layout-container" [ngClass]="containerClass">
  <layout-sidebar-left></layout-sidebar-left>
  <div class="layout-content-wrapper">
    <div class="header-wrapper"
         [class.collapsed]="(scrollEvents$ | async) === 'DOWN'"
    >
      <layout-topbar></layout-topbar>
      <layout-breadcrumb class="content-breadcrumb"></layout-breadcrumb>
    </div>
    <div class="layout-content"
         [class.header-collapsed]="(scrollEvents$ | async) === 'DOWN'"
    >
      <router-outlet></router-outlet>
    </div>
  </div>
  <layout-sidebar-right></layout-sidebar-right>
  <layout-theme-config></layout-theme-config>
  <div class="layout-mask"></div>
</div>


<p-confirmDialog [key]="CONFIRM_DIALOG"
                 rejectButtonStyleClass="p-button-outlined"
                 [style]="{width: '50vw'}"
                 [baseZIndex]="10000"
></p-confirmDialog>

<p-confirmDialog [key]="CONFIRM_DIALOG_NON_CLOSEABLE"
                 class="hide-close-button"
                 rejectButtonStyleClass="p-button-outlined"
                 [style]="{width: '50vw'}"
                 [baseZIndex]="10000"
                 [rejectVisible]="false"
                 [dismissableMask]="false"
                 [closeOnEscape]="false"
></p-confirmDialog>

<p-toast></p-toast>
