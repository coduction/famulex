<p-card>
  <web-table
    heading="Users" i18n-heading

    [metaData]="tableMetaData$ | async"
    [data]="users$ | async"
    [loading$]="loading$"

    [columns]="userColumns"
    [showSearch]="true"

    [tableActions]="tableActions"
    [entryActions]="entryActions"
    [selectionActions]="selectionActions"

    (loadData)="onLoadData($event)"
  ></web-table>
</p-card>
