<p-card>
  <web-table
    heading="Courses" i18n-heading

    [metaData]="tableMetaData$ | async"
    [data]="courseDrafts$ | async"
    [loading$]="loading$"

    [tabs]="tabs"

    [columns]="columns"
    [showSearch]="true"

    [tableActions]="tableActions"
    [columnActions]="columnActions"
    [entryActions]="entryActions"
    [selectionActions]="selectionActions"

    (loadData)="onLoadData($event)"
  ></web-table>
</p-card>
