<div class="grid">
  <div class="col-12 md:col-5">
    <h2 class="mb-0 mr-1 inline">{{ title$ | async }}</h2>
    <span *ngIf="author$ | async as author"
          class="text-color-secondary"
    >
    by {{ author }}
  </span>
  </div>


  <div class="col-4 md:col">
    <authoring-course-draft-status *ngIf="status$ | async as status"
                                   [status]="status"
    />
  </div>

  <div class="col-8 md:col-5 flex justify-content-end">
    <p-splitButton label="Publish" i18n-label
                   icon="fa fa-upload"
                   appendTo="body"
                   [model]="actions"
                   (onClick)="onPublish()"
    />
  </div>
</div>
