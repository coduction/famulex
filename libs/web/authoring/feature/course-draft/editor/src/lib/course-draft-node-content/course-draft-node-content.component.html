<ng-container *ngIf="currentNode$ | async as currentNode">
  <div class="flex gap-2 align-items-baseline">
    <h4 class="inline"><i [class]="iconForCourseNodeType(currentNode)"></i>{{ currentNode.title }}</h4>
    <span class="flex-grow-1 text-color-secondary">{{ translateCourseNodeType(currentNode)}}</span>

    <button *ngFor="let action of nodeActions$ | async"
            pButton
            [icon]="action.icon ?? ''"
            [label]="action.label"
            [class.p-button-outlined]="!action.primary"
            (click)="action.onClick()"
    ></button>
  </div>

  <div class="my-3" [innerHTML]="currentNode.description"></div>

  <ng-container [ngSwitch]="currentNode.type">
    <authoring-course-draft-node-chapter *ngSwitchCase="CourseNodeType.Chapter" />
    <authoring-course-draft-node-text *ngSwitchCase="CourseNodeType.Text" />
    <authoring-course-draft-node-pdf *ngSwitchCase="CourseNodeType.Pdf" />
    <authoring-course-draft-node-quiz *ngSwitchCase="CourseNodeType.Quiz" />
    <authoring-course-draft-node-video *ngSwitchCase="CourseNodeType.Video" />
  </ng-container>
</ng-container>
