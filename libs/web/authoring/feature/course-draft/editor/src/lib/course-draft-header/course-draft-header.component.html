<ng-container *ngIf="courseDraft$ | async as courseDraft">
  <div class="grid">
    <div class="col-12 md:col-5">
      <h2 class="mb-0 mr-1 inline">{{ courseDraft.title }}</h2>
      <span *ngIf="courseDraft.author"
            class="text-color-secondary"
      >
        by {{ courseDraft.author }}
      </span>
    </div>


    <div class="col-4 md:col-2">
      <authoring-course-draft-status [status]="courseDraft.status" />
    </div>

    <div class="col-8 md:col-5 flex justify-content-end">
      <p-splitButton label="Publish" i18n-label
                     icon="fa fa-upload"
                     appendTo="body"
                     [model]="generateActions(courseDraft)"
                     (onClick)="onPublish(courseDraft)"
      />
    </div>
  </div>
</ng-container>
