<p-card>
  <web-table
    heading="Users" i18n-heading

    [loading$]="loading$"
    [columns]="userColumns"
    [data]="users$ | async"

    [tableActions]="tableActions"
    [entryActions]="entryActions"
    [selectionActions]="selectionActions"

    [totalEntries]="totalUsers$ | async"
    [pageSize]="pageSize$ | async"

    (pagination)="onPagination($event)"
  ></web-table>
</p-card>
