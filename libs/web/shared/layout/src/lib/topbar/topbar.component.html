<div class="layout-topbar">
  <div class="topbar-start">
    <button #menuButton type="button" class="topbar-menubutton p-link p-trigger" (click)="onMenuButtonClick()">
      <i class="pi pi-bars"></i>
    </button>

    <layout-breadcrumb class="topbar-breadcrumb"></layout-breadcrumb>
  </div>

  <div class="topbar-end">
    <ul class="topbar-menu">
      <!--      <li class="topbar-search">-->
      <!--        <span class="p-input-icon-left">-->
      <!--            <i class="pi pi-search"></i>-->
      <!--            <input type="text" pInputText placeholder="Search" class="w-12rem sm:w-full">-->
      <!--        </span>-->
      <!--      </li>-->
      <li>
        <button pButton type="button" icon="fa fa-cog"
                class="p-button-outlined p-button-rounded"
                (click)="onConfigButtonClick()"
        ></button>
      </li>

      <li>
        <button pButton type="button" icon="fa fa-globe fa-swap-opacity"
                style="--fa-secondary-opacity: 0"
                class="p-button-outlined p-button-rounded"
                (click)="languageChooser.show($event)"
        ></button>
      </li>

      <li>
        <button *ngIf="profilePicture"
                type="button"
                class="p-link"
                (click)="onProfileButtonClick()"
        >
          <img [ngSrc]="profilePicture" alt="Profile" />
        </button>

        <button *ngIf="!profilePicture"
                pButton
                type="button"
                class="p-button-outlined p-button-rounded"
                icon="fa fa-user"
                (click)="onProfileButtonClick()"
        ></button>
      </li>

      <li>
        <button pButton type="button" icon="fa fa-power-off"
                class="p-button-outlined p-button-rounded"
                (click)="onLogout($event)"
        ></button>
      </li>
    </ul>
  </div>
</div>

<p-overlayPanel #languageChooser>
  <div class="flex flex-column">
    <button pButton pRipple
            label="English"
            class="p-button-text"
            (click)="onChangeLanguage('en')"
    ></button>
    <button pButton pRipple
            label="Deutsch"
            class="p-button-text"
            (click)="onChangeLanguage('de')"
    ></button>
    <button pButton pRipple
            label="Français"
            class="p-button-text"
            (click)="onChangeLanguage('fr')"
    ></button>
    <button pButton pRipple
            label="Español"
            class="p-button-text"
            (click)="onChangeLanguage('es')"
    ></button>
    <button pButton pRipple
            label="Srpski"
            class="p-button-text"
            (click)="onChangeLanguage('sr')"
    ></button>
    <button pButton pRipple
            label="Српски"
            class="p-button-text"
            (click)="onChangeLanguage('sr-cyrl')"
    ></button>
  </div>
</p-overlayPanel>
