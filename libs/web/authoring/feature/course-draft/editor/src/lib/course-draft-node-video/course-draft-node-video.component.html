<ng-container *ngFor="let item of items$ | async; index as i">
  <div *ngIf="item.filePermissions.length else uploadVideo">
    <ui-video-player [filePermissions]="item.filePermissions" />
  </div>

  <ng-template #uploadVideo>
    <p-fileUpload #fileUpload
                  [auto]=true
                  [customUpload]="true"
                  accept="video/*"
                  chooseLabel="Upload Video"
                  (uploadHandler)="onUploadVideo(item, $event.files)"
    ></p-fileUpload>
  </ng-template>
</ng-container>
