<div class="layout-topbar">
  <div class="topbar-start">
    <button #menuButton type="button" class="topbar-menubutton p-link p-trigger shadow-4" (click)="onMenuButtonClick()">
      <i class="fa fa-bars"></i>
    </button>

    <layout-breadcrumb class="topbar-breadcrumb"></layout-breadcrumb>
  </div>

  <div class="topbar-end">
    <ul class="topbar-menu">
      <!--      <li class="topbar-search">-->
      <!--              <span class="p-input-icon-left">-->
      <!--                  <i class="pi pi-search"></i>-->
      <!--                  <input type="text" pInputText placeholder="Search" class="w-12rem sm:w-full shadow-4">-->
      <!--              </span>-->
      <!--      </li>-->
      <li>
        <button type="button"
                class="topbar-menubutton p-link p-trigger shadow-4"
                pTooltip="Layout Settings" i18n-pTooltip
                tooltipPosition="bottom"
                [showDelay]="500"
                (click)="onConfigButtonClick()">
          <i class="fa fa-cog"></i>
        </button>
      </li>

      <li>
        <button type="button"
                class="topbar-menubutton p-link p-trigger shadow-4"
                pTooltip="Choose Language" i18n-pTooltip
                tooltipPosition="bottom"
                [showDelay]="500"
                (click)="languageChooser.show($event)">
          <i class="fa fa-globe fa-swap-opacity"
             style="--fa-secondary-opacity: 0.3"
          ></i>
        </button>
      </li>

      <li>
        <button type="button"
                class="topbar-menubutton p-link p-trigger shadow-4"
                pTooltip="Show Menu" i18n-pTooltip
                tooltipPosition="bottom"
                [showDelay]="500"
                (click)="onProfileButtonClick()">
          <i class="fa fa-user"></i>
        </button>
        <!--        <button *ngIf="profilePicture"-->
        <!--                type="button"-->
        <!--                class="p-link"-->
        <!--                (click)="onProfileButtonClick()"-->
        <!--        >-->
        <!--          <img [ngSrc]="profilePicture" alt="Profile" />-->
        <!--        </button>-->

        <!--        <button *ngIf="!profilePicture"-->
        <!--                pButton-->
        <!--                type="button"-->
        <!--                class="p-button-rounded p-button-raised"-->
        <!--                icon="fa fa-user"-->
        <!--                (click)="onProfileButtonClick()"-->
        <!--        ></button>-->
      </li>

      <li>
        <button type="button"
                class="topbar-menubutton p-link p-trigger shadow-4"
                (click)="onLogout($event)">
          <i class="fa fa-power-off"></i>
        </button>
        <!--        <button pButton type="button" icon="fa fa-power-off"-->
        <!--                class="p-button-rounded p-button-raised"-->
        <!--                (click)="onLogout($event)"-->
        <!--        ></button>-->
      </li>
    </ul>
  </div>
</div>

<p-overlayPanel #languageChooser>
  <div class="flex flex-column">
    <button pButton pRipple
            label="English"
            class="p-button-text"
            (click)="onChangeLanguage('en')"
    ></button>
    <button pButton pRipple
            label="Deutsch"
            class="p-button-text"
            (click)="onChangeLanguage('de')"
    ></button>
    <button pButton pRipple
            label="Français"
            class="p-button-text"
            (click)="onChangeLanguage('fr')"
    ></button>
    <button pButton pRipple
            label="Español"
            class="p-button-text"
            (click)="onChangeLanguage('es')"
    ></button>
    <button pButton pRipple
            label="Srpski"
            class="p-button-text"
            (click)="onChangeLanguage('sr')"
    ></button>
    <button pButton pRipple
            label="Српски"
            class="p-button-text"
            (click)="onChangeLanguage('sr-cyr')"
    ></button>
  </div>
</p-overlayPanel>
