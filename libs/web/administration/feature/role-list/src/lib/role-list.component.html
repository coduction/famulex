<p-card>
  <web-table
    heading="Roles" i18n-heading

    [loading$]="loading$"
    [columns]="roleColumns"
    [data]="roles$ | async"
    [showSearch]="true"

    [tableActions]="tableActions"
    [entryActions]="entryActions"
    [selectionActions]="selectionActions"

    [totalEntries]="totalRoles$ | async"
    [pageSize]="pageSize$ | async"

    (loadData)="onLoadData($event)"
  ></web-table>
</p-card>
