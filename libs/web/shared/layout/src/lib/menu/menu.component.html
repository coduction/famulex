<ul class="layout-menu flex flex-column gap-3">
  <ng-container *ngFor="let item of model; let i = index;">
    <li *ngIf="!item.separator" layout-menu-item
        [item]="item"
        [index]="i"
        [root]="true"
    ></li>
    
    <li *ngIf="item.separator"
        class="menu-separator"
    ></li>
  </ng-container>
</ul>
