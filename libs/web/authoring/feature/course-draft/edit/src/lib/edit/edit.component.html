<form [formGroup]="createCourseDraftForm" (ngSubmit)="onSubmit()">
  <div class="flex flex-column gap-4">
    <div class="grid p-fluid">
      <div class="col-12">
        <ui-form-label formControlName="title" i18n>Title</ui-form-label>
        <input pInputText
               type="text"
               id="title"
               formControlName="title">
        <ui-form-error formControlName="title"></ui-form-error>
      </div>

      <div class="col-12">
        <ui-form-label formControlName="author" i18n>Author</ui-form-label>
        <input pInputText
               type="text"
               id="author"
               formControlName="author">
        <ui-form-error formControlName="author"></ui-form-error>
      </div>

      <div class="col-12">
        <ui-form-label formControlName="description" i18n>Description</ui-form-label>
        <textarea pInputTextarea
                  type="text"
                  id="description"
                  formControlName="description">
        </textarea>
        <ui-form-error formControlName="description"></ui-form-error>
      </div>
    </div>

    <div class="flex gap-3 justify-content-end">
      <button pButton pRipple
              type="button"
              class="p-button-outlined"
              [label]="cancelButton.label"
              [icon]="cancelButton.icon ?? ''"
              [disabled]="cancelButton.disabled"
              (click)="onCancel()"
      ></button>

      <button *ngIf="dialogConfig?.data else create"
              pButton pRipple
              type="submit"
              loadingIcon="fa fa-spin fa-rotate"
              [label]="updateButton.label"
              [icon]="updateButton.icon ?? ''"
              [disabled]="updateButton.disabled"
              [loading]="updateButton.loading ?? false"
      ></button>

      <ng-template #create>
        <button pButton pRipple
                type="submit"
                loadingIcon="fa fa-spin fa-rotate"
                [label]="createButton.label"
                [icon]="createButton.icon ?? ''"
                [disabled]="createButton.disabled"
                [loading]="createButton.loading ?? false"
        ></button>
      </ng-template>
    </div>
  </div>
</form>
